name: build-and-release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source branch/SHA to verify, or existing version tag to publish'
        type: string
        required: true
      publish:
        description: 'Publish an existing version tag after verification'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.source_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && github.event.created && !github.event.deleted)
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate source and release identity
        id: meta
        run: python tools/ci_release.py
  build:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && github.event.created && !github.event.deleted)
    runs-on: windows-2022
    env:
      QT_KIT: C:\Qt\6.12.0\msvc2022_64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validation dependencies
        run: python -m pip install jsonschema==4.23.0 aqtinstall==3.3.0
      - name: Install Qt 6.12.0 (msvc2022_64)
        run: python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 --outputdir C:\Qt
      - name: Configure
        run: cmake -S . -B build/ci -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_KIT"
      - name: Build
        run: cmake --build build/ci --config Release --parallel 2
      - name: Run CTest
        run: |
          $env:PATH = "$env:QT_KIT\bin;$env:PATH"
          ctest --test-dir build/ci -C Release --output-on-failure --no-tests=error
      - name: Run engine scenarios
        run: python tests/devshell_scenarios.py
      - name: Run protocol round trips
        run: python -X utf8 tests/protocol_roundtrip.py --exe build/ci/plugin/Release/cursorwrap.exe --app-dir "$env:QT_KIT\bin"
      - name: Package the tested binaries
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          $options = @('tools/package.py', '--bin-dir', 'build/ci/plugin/Release', '--out', 'dist/ci')
          if ($env:RELEASE_TAG) { $options += @('--tag', $env:RELEASE_TAG) }
          python @options
      - name: Validate manifest, docs and package
        run: python tests/validate.py --package-dir dist/ci --out dist/ci/static.json
      - name: Verify package and checksum
        run: python tools/ci_release.py dist/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-package
          path: dist/ci/
          if-no-files-found: error
  publish:
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true' && (github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && github.event.created && !github.event.deleted))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-package
          path: dist/ci
      - name: Verify the release candidate
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          python tools/ci_release.py
          python tools/ci_release.py dist/ci
      - name: Publish verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            echo 'Release already exists.' >&2
            exit 1
          fi
          sleep $((3 + RANDOM % 3))
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --latest=true \
            --notes-file dist/ci/release-notes.md dist/ci/*.wsplugin dist/ci/*.sha256
